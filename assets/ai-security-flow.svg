      <text x="32" y="180" fill="#cbd5e1" font-size="20">Deterministic policy</text>
      <text x="32" y="216" fill="#cbd5e1" font-size="20">Identity &amp; least privilege</text>
      <text x="32" y="252" fill="#cbd5e1" font-size="20">Human approval</text>
    </g>

    <g transform="translate(1030 295)">
