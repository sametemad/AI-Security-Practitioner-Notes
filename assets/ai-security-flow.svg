    <text x="112" y="719" fill="#fff" font-size="26" font-weight="700">Three practitioner rules</text>
    <text x="112" y="762" fill="#cbd5e1" font-size="21">Run models more than once</text>
    <text x="594" y="762" fill="#cbd5e1" font-size="21">Keep authorization deterministic</text>
    <text x="1065" y="762" fill="#cbd5e1" font-size="21">Treat agent skills as supply-chain code</text>
