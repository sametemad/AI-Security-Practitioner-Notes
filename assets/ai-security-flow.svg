      <text x="32" y="132" fill="#fff" font-size="26" font-weight="700">4. Agent Runtime</text>
      <text x="32" y="180" fill="#cbd5e1" font-size="20">Prompt defenses</text>
      <text x="32" y="216" fill="#cbd5e1" font-size="20">Tool access controls</text>
      <text x="32" y="252" fill="#cbd5e1" font-size="20">Logging &amp; kill switch</text>
    </g>

