      <circle cx="62" cy="66" r="30" fill="#173b68"/>
      <path d="M47 51h30v30H47zM55 43h30v30" fill="none" stroke="#60a5fa" stroke-width="4"/>
      <text x="32" y="132" fill="#fff" font-size="29" font-weight="700">2. Validate</text>
      <text x="32" y="180" fill="#cbd5e1" font-size="20">Cross-model compare</text>
      <text x="32" y="216" fill="#cbd5e1" font-size="20">Reduce false positives</text>
      <text x="32" y="252" fill="#cbd5e1" font-size="20">Human verification</text>
