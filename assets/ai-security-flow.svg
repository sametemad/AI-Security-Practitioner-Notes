      <text x="62" y="76" text-anchor="middle" fill="#c4b5fd" font-size="32">AI</text>
      <text x="32" y="132" fill="#fff" font-size="29" font-weight="700">1. AI Models</text>
      <text x="32" y="180" fill="#cbd5e1" font-size="20">Multi-model analysis</text>
      <text x="32" y="216" fill="#cbd5e1" font-size="20">Repeated runs</text>
      <text x="32" y="252" fill="#cbd5e1" font-size="20">Targeted context</text>
